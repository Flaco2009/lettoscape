<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Lettoscape</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="ember" aria-hidden="true"></span>
      <div>
        <h1>Lettoscape</h1>
        <p class="sub" id="status">Live wallpaper</p>
      </div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="pin" title="Pin: keep panel open" aria-label="Pin panel" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M14.5 3.5l6 6-2.2.6-3.6 3.6.4 4.1-1.6 1.6-3.7-3.7L5 20.5 3.5 19l4.8-4.8-3.7-3.7 1.6-1.6 4.1.4 3.6-3.6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="close" title="Close" aria-label="Close">✕</button>
    </div>
  </header>

  <div class="quick">
    <button id="qRandom" title="Random scene (Ctrl+Alt+R)">🎲 Random</button>
    <button id="qNext" title="Next scene (Ctrl+Alt+→)">⏭ Next</button>
    <button id="qMute" aria-pressed="false" title="Sound on/off (Ctrl+Alt+M)">🔊 Sound</button>
    <button id="qPause" aria-pressed="false" title="Pause wallpaper (Ctrl+Alt+P)">⏸ Pause</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="scene" class="on">Scene</button>
    <button data-tab="look">Look</button>
    <button data-tab="perf">Performance</button>
    <button data-tab="sys">System</button>
  </nav>

  <main>
    <section data-tab="scene">
      <div class="scenes" id="scenes"></div>
      <label class="toggle"><span>Switch scenes automatically</span><input type="checkbox" data-key="autoSwitch"><i></i></label>
      <div class="sub-opts" id="switchOpts">
        <div class="seg" data-key="switchMinutes" data-num>
          <button data-val="5">5 min</button><button data-val="15">15</button><button data-val="30">30</button><button data-val="60">60</button>
        </div>
        <label class="toggle"><span>Random order</span><input type="checkbox" data-key="switchRandom"><i></i></label>
      </div>
    </section>

    <section data-tab="scene">
      <h2>Time of day</h2>
      <div class="chips" id="timeChips">
        <button data-t="real">🕒 Now</button>
        <button data-t="7">🌅 Morning</button>
        <button data-t="13">☀ Noon</button>
        <button data-t="18.5">🌇 Evening</button>
        <button data-t="23">🌙 Night</button>
      </div>
      <div class="seg" data-key="timeMode" hidden>
        <button data-val="real"></button><button data-val="fixed"></button>
      </div>
      <label class="row" id="hourRow">
        <span>Fine tune</span>
        <input type="range" min="0" max="23.75" step="0.25" data-key="hour">
        <output data-for="hour" data-fmt="clock"></output>
      </label>
    </section>

    <section data-tab="scene">
      <h2>Weather</h2>
      <div class="chips" data-key="weather">
        <button data-val="clear">☀ Clear</button>
        <button data-val="cloudy">☁ Cloudy</button>
        <button data-val="rain">☂ Rain</button>
        <button data-val="snow">❄ Snow</button>
        <button data-val="fog">≋ Fog</button>
      </div>
      <label class="row"><span>Valley fog</span><input type="range" min="0" max="1" step="0.01" data-key="fog"><output data-for="fog" data-fmt="pct"></output></label>
      <label class="row"><span>Clouds</span><input type="range" min="0" max="1" step="0.01" data-key="clouds"><output data-for="clouds" data-fmt="pct"></output></label>
    </section>

    <section data-tab="look">
      <h2>Image</h2>
      <label class="row"><span>Brightness</span><input type="range" min="0.5" max="1.5" step="0.01" data-key="brightness"><output data-for="brightness" data-fmt="pct"></output></label>
      <label class="row"><span>Speed</span><input type="range" min="0" max="3" step="0.05" data-key="speed"><output data-for="speed" data-fmt="x"></output></label>
      <label class="toggle"><span>Mouse parallax</span><input type="checkbox" data-key="parallax"><i></i></label>
    </section>

    <section data-tab="look">
      <h2>Sound</h2>
      <label class="toggle"><span>Ambient sound</span><input type="checkbox" data-key="sound"><i></i></label>
      <label class="row"><span>Volume</span><input type="range" min="0" max="1" step="0.01" data-key="volume"><output data-for="volume" data-fmt="pct"></output></label>
    </section>

    <section data-tab="perf">
      <h2>Performance</h2>
      <div class="seg power" id="power">
        <button data-power="eco">🍃 Quiet</button>
        <button data-power="balanced">⚖ Balanced</button>
        <button data-power="beauty">✨ Beauty</button>
      </div>
      <p class="hint" id="powerHint"></p>
      <div class="live" id="live"><span class="dot"></span><span id="liveText">…</span></div>
      <label class="toggle"><span>Adapt to hardware automatically</span><input type="checkbox" data-key="autoPerformance"><i></i></label>
      <p class="hint">Lowers resolution and frame rate on its own when the GPU is overloaded, and raises them again when there is headroom.</p>
      <label class="toggle"><span>Quiet mode on battery</span><input type="checkbox" data-key="batterySaver"><i></i></label>
      <p class="label">Animate</p>
      <div class="seg" data-key="pauseMode">
        <button data-val="desktop">Desktop only</button>
        <button data-val="visible">When visible</button>
        <button data-val="never">Always</button>
      </div>
      <details class="adv">
        <summary>Advanced</summary>
        <div class="seg" data-key="fps" data-num>
          <button data-val="15">15 FPS</button>
          <button data-val="20">20</button>
          <button data-val="24">24</button>
          <button data-val="30">30</button>
          <button data-val="60">60</button>
        </div>
        <label class="row"><span>Resolution</span><input type="range" min="0.3" max="1" step="0.05" data-key="renderScale"><output data-for="renderScale" data-fmt="pct"></output></label>
        <div class="seg" data-key="quality">
          <button data-val="low">Fewer details</button>
          <button data-val="high">All details</button>
        </div>
      </details>
      <label class="toggle"><span>Prepare all scenes (gentle, not on battery)</span><input type="checkbox" data-key="preload"><i></i></label>
      <label class="toggle"><span>Match taskbar to scene</span><input type="checkbox" data-key="taskbarSync"><i></i></label>
    </section>

    <section data-tab="sys">
      <h2>System</h2>
      <label class="toggle"><span>Start with Windows</span><input type="checkbox" data-key="autostart"><i></i></label>
      <label class="toggle"><span>All displays</span><input type="checkbox" data-key="allDisplays"><i></i></label>
      <label class="toggle"><span>Show in taskbar</span><input type="checkbox" data-key="showInTaskbar"><i></i></label>
      <label class="toggle"><span>Keyboard shortcuts (Ctrl+Alt+L panel, →, R, M, P)</span><input type="checkbox" data-key="hotkeys"><i></i></label>
      <label class="toggle"><span>Menu corner bottom left (☰)</span><input type="checkbox" data-key="cornerMenu"><i></i></label>
      <p class="hint">Tip: right-click the taskbar icon → “Pin to taskbar”.</p>
    </section>
  </main>

  <footer>
    <button class="ghost" id="reset">Reset</button>
    <span class="ver" id="ver"></span>
    <button class="ghost danger" id="quit">Quit</button>
  </footer>

  <script src="panel.js"></script>
</body>
</html>
